# Hunger points, from 0 to 19. Two points equal one hunger icon.
# Eat when half a hunger icon is missing.
hunger-threshold: 19
# Checks once per second. One item is consumed per check at most.
check-interval-ticks: 20
# Only these ordinary foods are used; valuable/special and harmful foods are excluded.
foods:
  - BREAD
  - COOKED_BEEF
  - COOKED_PORKCHOP
  - COOKED_CHICKEN
  - COOKED_MUTTON
  - COOKED_RABBIT
  - COOKED_COD
  - COOKED_SALMON
  - BAKED_POTATO
  - CARROT
  - APPLE
  - MELON_SLICE
  - SWEET_BERRIES
  - GLOW_BERRIES
  - DRIED_KELP
  - COOKIE
  - PUMPKIN_PIE

# Run-fast adds this fraction of normal sprint speed every 20 ticks (1 second).
run-fast:
  speed-increase: 0.3333333333333333
  # Maximum bonus: 2.0 means triple normal sprint speed after 6 seconds.
  maximum-bonus: 2.0

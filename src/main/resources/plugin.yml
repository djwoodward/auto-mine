name: auto-mine
version: '0.1.0'
main: dev.auto_mine.AutoMinePlugin
api-version: '26.2'
description: Optional automatic eating for survival players.
commands:
  auto-mine:
    description: Configure your auto-mine features.
    usage: /auto-mine auto-eat [on|off|status]
    permission: auto-mine.autoeat
permissions:
  auto-mine.autoeat:
    description: Allows a player to enable automatic eating.
    default: true
